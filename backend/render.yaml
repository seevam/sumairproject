services:
  - type: web
    name: postureguard-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: ALLOWED_ORIGINS
        # Set this to your deployed frontend origin once Vercel gives you one.
        sync: false
      - key: DATABASE_URL
        # Strongly recommended. Render's free tier has an ephemeral filesystem,
        # so without Postgres the SQLite file is wiped on every redeploy and on
        # idle spin-down. The browser keeps the authoritative copy either way,
        # but server-side data is only durable with this set.
        sync: false
      - key: POSTUREGUARD_DB
        # Only used when DATABASE_URL is unset.
        value: /tmp/postureguard.db
